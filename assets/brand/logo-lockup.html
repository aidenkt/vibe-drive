<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:center;padding:12px 0}
.tile{width:220px;height:220px;border-radius:50px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.lockup{display:flex;align-items:center;gap:14px;background:#F2EADB;padding:22px 26px;border-radius:18px}
.lockup .word{font-family:"Instrument Serif",serif;font-size:46px;color:#14110F;line-height:1}
.lockup .sub{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:2px;color:#14110F99;margin-top:6px}
</style></head><body>

<!-- app icon: pixel sun + pixel hills (stepped, crispEdges), smooth line-art road -->
<svg class="tile" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" fill="#F2EADB"/>
  <g shape-rendering="crispEdges">
    <!-- pixel sun -->
    <path fill="#FF5A1F" d="M13 6h6v1h2v1h1v2h1v4H9v-4h1V8h1V7h2z"/>
    <!-- horizon stripes cut through sun -->
    <rect x="9" y="11" width="14" height="1" fill="#F2EADB"/>
    <rect x="9" y="13" width="14" height="0.6" fill="#F2EADB"/>
    <!-- pixel hills -->
    <path fill="#14110F" d="M0 18h3v-1h3v-1h3v1h2v1h3v-2h3v-1h4v1h2v1h3v1h3v1h3v13H0z"/>
    <!-- pixel water strip -->
    <path fill="#14110F" opacity=".18" d="M0 14h32v1H0z"/>
  </g>
  <!-- smooth road, line art -->
  <path d="M10 32 C 12 27, 22 26, 19 22 S 13 19.5, 16.5 18" fill="none" stroke="#FF5A1F" stroke-width="2.2" stroke-linecap="round"/>
</svg>

<!-- dark variant -->
<svg class="tile" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" fill="#14110F"/>
  <g shape-rendering="crispEdges">
    <path fill="#FF5A1F" d="M13 6h6v1h2v1h1v2h1v4H9v-4h1V8h1V7h2z"/>
    <rect x="9" y="11" width="14" height="1" fill="#14110F"/>
    <rect x="9" y="13" width="14" height="0.6" fill="#14110F"/>
    <path fill="#F2EADB" d="M0 18h3v-1h3v-1h3v1h2v1h3v-2h3v-1h4v1h2v1h3v1h3v1h3v13H0z"/>
  </g>
  <path d="M10 32 C 12 27, 22 26, 19 22 S 13 19.5, 16.5 18" fill="none" stroke="#FF5A1F" stroke-width="2.2" stroke-linecap="round"/>
</svg>

<!-- wordmark lockup -->
<div class="lockup">
  <svg width="56" height="56" viewBox="0 0 32 32" style="border-radius:13px">
    <rect width="32" height="32" fill="#14110F"/>
    <g shape-rendering="crispEdges">
      <path fill="#FF5A1F" d="M13 6h6v1h2v1h1v2h1v4H9v-4h1V8h1V7h2z"/>
      <rect x="9" y="11" width="14" height="1" fill="#14110F"/>
      <rect x="9" y="13" width="14" height="0.6" fill="#14110F"/>
      <path fill="#F2EADB" d="M0 18h3v-1h3v-1h3v1h2v1h3v-2h3v-1h4v1h2v1h3v1h3v1h3v13H0z"/>
    </g>
    <path d="M10 32 C 12 27, 22 26, 19 22 S 13 19.5, 16.5 18" fill="none" stroke="#FF5A1F" stroke-width="2.2" stroke-linecap="round"/>
  </svg>
  <div><div class="word">Scenic Route</div><div class="sub">TAKE THE LONG WAY</div></div>
</div>
</body></html>
